    <script>
      (function() {
        function setupChatBadge() {
          var btn = document.querySelector('button[aria-label="Chat"]');
          if (!btn) {
            setTimeout(setupChatBadge, 250);
            return;
          }

          if (document.getElementById('hostlet-chat-badge')) return;

          // Create badge container
          var badge = document.createElement('div');
          badge.id = 'hostlet-chat-badge';
          badge.innerHTML = `
            <span style="display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:13px; color:#0f172a; white-space:nowrap; letter-spacing:-0.01em;">
              <span style="font-size:14px;">✨</span>
              <span>Ask MagicScale AI</span>
            </span>
            <span style="position:relative; display:flex; width:8px; height:8px; margin-left:2px;">
              <span style="position:absolute; width:100%; height:100%; border-radius:50%; background:#22c55e; opacity:0.75; animation:magicPulse 1.8s cubic-bezier(0,0,0.2,1) infinite;"></span>
              <span style="position:relative; border-radius:50%; width:8px; height:8px; background:#16a34a;"></span>
            </span>
          `;

          // Add styling
          badge.style.cssText = `
            position: fixed;
            right: 86px;
            bottom: 26px;
            background: #ffffff;
            border: 1px solid rgba(30, 58, 138, 0.15);
            padding: 9px 14px;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 2147483645;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            backdrop-filter: blur(8px);
          `;

          // Animation keyframes
          if (!document.getElementById('hostlet-badge-styles')) {
            var style = document.createElement('style');
            style.id = 'hostlet-badge-styles';
            style.textContent = `
              @keyframes magicPulse {
                0% { transform: scale(0.95); opacity: 0.8; }
                70% { transform: scale(2.2); opacity: 0; }
                100% { transform: scale(2.2); opacity: 0; }
              }
              #hostlet-chat-badge:hover {
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 14px 28px -5px rgba(30, 58, 138, 0.25);
                border-color: rgba(30, 58, 138, 0.35);
              }
              @media (max-width: 480px) {
                #hostlet-chat-badge {
                  bottom: 84px !important;
                  right: 20px !important;
                  padding: 7px 12px !important;
                  font-size: 12px !important;
                }
              }
            `;
            document.head.appendChild(style);
          }

          // Clicking badge clicks the hostlet button
          badge.addEventListener('click', function() {
            btn.click();
          });

          // Hide badge when chat window opens
          btn.addEventListener('click', function() {
            setTimeout(function() {
              var iframe = document.querySelector('iframe[title="Chat"]');
              if (iframe && iframe.style.display !== 'none') {
                badge.style.opacity = '0';
                badge.style.pointerEvents = 'none';
              } else {
                badge.style.opacity = '1';
                badge.style.pointerEvents = 'auto';
              }
            }, 50);
          });

          document.body.appendChild(badge);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupChatBadge);
        } else {
          setupChatBadge();
        }
      })();
    </script>
